name: docs-mcp

x-image: &image
  build: .
  image: docs-mcp:latest
  env_file:
    - path: .env
      required: false

services:
  # The MCP endpoint. Reads the index only; the docs tree is not mounted here.
  server:
    <<: *image
    command: ["serve"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8765}:8765"
    volumes:
      - index:/data
    restart: unless-stopped

  # One-shot sync: `docker compose up -d` runs it alongside the server.
  # It exits after publishing the index; run `docker compose start indexer` to retry.
  indexer:
    <<: *image
    command: ["sync"]
    environment:
      SOURCES_CONFIG: /sources.toml
      STATE_DIR: /state
    volumes:
      - ./sources.toml:/sources.toml:ro
      # Relative local source paths such as `docs/logic` resolve from /app.
      # Origins are read-only; acquisition copies eligible files into /state.
      - ./docs:/app/docs:ro
      - ./.docs-mcp:/state
      - index:/data

# The index lives in a named volume, not a bind mount: the container runs as the
# non-root `app` user (uid 999), and a bind-mounted host directory arrives with the
# host's ownership, so `/data` would be unwritable on a fresh Linux clone. Docker
# seeds a new named volume from the image, where /data is already owned by app.
volumes:
  index:
