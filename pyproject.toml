[project]
name = "docs-mcp"
version = "0.1.0"
description = "Hybrid documentation search over MCP (2026-07-28)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.0.0,<3",
    "fastembed>=0.8.0,<0.9",
    "sqlite-vec>=0.1.9",
    "pydantic>=2.11",
    "uvicorn>=0.34",
    "pypdf>=5,<7",
]

[project.scripts]
docs-mcp = "docs_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
